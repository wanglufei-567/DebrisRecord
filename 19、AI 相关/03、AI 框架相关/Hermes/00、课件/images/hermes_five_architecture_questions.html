<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>评估 Agent 架构的五个问题</title>
  <link rel="stylesheet" href="./hermes_diagram_theme.css">
  <style>
    html, body, .artboard { width: 1000px; height: 610px; }

    .center {
      position: absolute;
      z-index: 3;
      left: 370px;
      top: 257px;
      width: 260px;
      height: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--purple);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 5px 14px rgba(15, 23, 42, 0.09);
      text-align: center;
    }

    .center h2 {
      margin: 0 0 7px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
    }

    .center p {
      margin: 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.4;
    }

    .lens {
      position: absolute;
      z-index: 3;
      min-height: 96px;
      padding: 14px 16px;
      border: 1.6px solid var(--color);
      border-radius: 13px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .lens::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 0;
      width: 34px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--color);
    }

    .lens h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .lens h3 span { color: var(--color); }

    .lens p {
      margin: 0;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.45;
    }

    .ownership { left: 365px; top: 112px; width: 270px; --color: var(--blue); }
    .pressure { left: 680px; top: 190px; width: 270px; --color: var(--green); }
    .enforcement { left: 640px; top: 394px; width: 270px; --color: var(--orange); }
    .correction { left: 90px; top: 394px; width: 270px; --color: var(--purple); }
    .evidence { left: 50px; top: 190px; width: 270px; --color: #64748b; }

    .connections {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: visible;
    }

    .closing-anchor {
      position: absolute;
      left: 240px;
      right: 240px;
      bottom: 28px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
      color: #334155;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }

    .closing-anchor strong { color: #6d28d9; }
  </style>
</head>
<body>
  <main class="artboard" aria-label="评估 Agent 架构的五个问题">
    <h1 class="diagram-title">评估 Agent 架构的五个问题</h1>
    <p class="diagram-subtitle">从 Hermes 机制中提炼，但可以直接迁移到任何 Agent 框架</p>

    <svg class="connections" width="1000" height="610" aria-hidden="true">
      <path d="M500 257 V208" fill="none" stroke="#3b82f6" stroke-width="1.7"/>
      <path d="M630 283 L680 239" fill="none" stroke="#10b981" stroke-width="1.7"/>
      <path d="M630 337 L656 405" fill="none" stroke="#fb923c" stroke-width="1.7"/>
      <path d="M370 337 L344 405" fill="none" stroke="#8b5cf6" stroke-width="1.7"/>
      <path d="M370 283 L320 239" fill="none" stroke="#64748b" stroke-width="1.7"/>
      <circle cx="500" cy="257" r="4" fill="#3b82f6"/>
      <circle cx="630" cy="283" r="4" fill="#10b981"/>
      <circle cx="630" cy="337" r="4" fill="#fb923c"/>
      <circle cx="370" cy="337" r="4" fill="#8b5cf6"/>
      <circle cx="370" cy="283" r="4" fill="#64748b"/>
    </svg>

    <section class="center">
      <h2>Agent 架构是否站得住</h2>
      <p>不要先数功能和模型<br>先追问责任、控制与证据</p>
    </section>

    <section class="lens ownership">
      <h3><span>①</span> 责任归属</h3>
      <p>状态、行动、身份与任务<br>分别由谁承担</p>
    </section>

    <section class="lens pressure">
      <h3><span>②</span> 压力驱动</h3>
      <p>什么新增责任<br>已经超出当前机制</p>
    </section>

    <section class="lens enforcement">
      <h3><span>③</span> 强制边界</h3>
      <p>规则只是影响判断<br>还是能够真正阻断动作</p>
    </section>

    <section class="lens correction">
      <h3><span>④</span> 修正独立性</h3>
      <p>变化发生在哪一层<br>谁能引入独立纠错</p>
    </section>

    <section class="lens evidence">
      <h3><span>⑤</span> 责任与证据</h3>
      <p>承担判断的一方<br>实际能看到哪些证据</p>
    </section>

    <div class="closing-anchor">机制随版本过期，<strong>这五个问题不会</strong></div>
  </main>
</body>
</html>
