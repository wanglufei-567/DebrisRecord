<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>传统编程与 Agent 的能力边界</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --paper: #fffefa;
      --ink: #17243a;
      --muted: #68778e;
      --border: #d8e0eb;
      --blue: #2869e8;
      --blue-deep: #2059c9;
      --blue-soft: #eef4ff;
      --green: #0eae99;
      --green-deep: #087f72;
      --green-soft: #e8faf6;
      --orange: #c45b12;
      --shadow: 0 14px 34px rgba(30, 47, 76, 0.06);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1440px;
      height: 780px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      width: 1440px;
      height: 780px;
      padding: 42px 64px 32px;
      background: var(--bg);
    }

    .opening {
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .opening-label {
      color: var(--green-deep);
      font-size: 15px;
      font-weight: 850;
      letter-spacing: 1.4px;
    }

    .opening-title {
      margin-top: 12px;
      white-space: nowrap;
      font-size: 36px;
      line-height: 1.18;
      font-weight: 850;
      letter-spacing: -0.8px;
    }

    .opening-title .turn { color: var(--green-deep); }

    .bridge {
      position: relative;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bridge::before,
    .bridge::after {
      content: "";
      position: absolute;
      top: 31px;
      width: 35%;
      border-top: 1.5px dashed;
    }

    .bridge::before {
      left: 8%;
      border-color: var(--blue);
    }

    .bridge::after {
      right: 8%;
      border-color: var(--green);
    }

    .bridge-text {
      position: relative;
      z-index: 1;
      min-width: 460px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      border: 1px solid #b9c5d5;
      border-radius: 15px;
      background: var(--paper);
      box-shadow: var(--shadow);
      font-size: 18px;
      font-weight: 800;
    }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      margin-top: 6px;
    }

    .panel {
      position: relative;
      height: 390px;
      padding: 28px 32px 25px;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .program { border: 1.5px solid #96b9fa; }
    .agent { border: 1.5px solid #89d6c9; }

    .panel-title {
      font-size: 27px;
      line-height: 1.15;
      font-weight: 850;
    }

    .program .panel-title { color: var(--blue-deep); }
    .agent .panel-title { color: var(--green-deep); }

    .panel-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .program-items {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .agent-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px;
    }

    .item {
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 750;
    }

    .program .item {
      height: 50px;
      display: grid;
      grid-template-columns: 168px 1fr;
      gap: 18px;
      align-items: center;
      border: 1px solid #cfddf3;
      background: #f8faff;
    }

    .program .item-note {
      margin-top: 0;
      font-size: 12.5px;
    }

    .agent .item {
      height: 76px;
      display: block;
      padding-top: 14px;
      border: 1px solid #cce7e1;
      background: #f8fcfb;
    }

    .item-title {
      font-size: 16px;
      line-height: 1.15;
      font-weight: 800;
    }

    .item-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 650;
    }

    .emphasis {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 25px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 850;
      text-align: center;
    }

    .program .emphasis {
      color: var(--blue-deep);
      border: 1px solid #c6d8f5;
      background: var(--blue-soft);
    }

    .agent .emphasis {
      color: var(--green-deep);
      border: 1px solid #bde3dc;
      background: var(--green-soft);
    }

    .conclusion {
      height: 72px;
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: var(--shadow);
      font-size: 20px;
      font-weight: 800;
    }

    .conclusion strong {
      color: var(--green-deep);
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <header class="opening" aria-label="能力边界判断">
      <div class="opening-label">能力边界</div>
      <div class="opening-title">
        不看“路径是否动态”，<span class="turn">真正要看“关键判断能否被充分建模”</span>
      </div>
    </header>

    <div class="bridge">
      <div class="bridge-text">同一任务，可以同时包含两种部分</div>
    </div>

    <section class="compare" aria-label="传统编程与 Agent 的能力边界">
      <article class="panel program">
        <div class="panel-title">能够充分建模</div>
        <div class="panel-subtitle">传统程序可靠处理</div>

        <div class="program-items">
          <div class="item">
            <div class="item-title">目标与状态可识别</div>
            <div class="item-note">输入、状态与预期结果可以被系统表达</div>
          </div>
          <div class="item">
            <div class="item-title">行动空间有边界</div>
            <div class="item-note">可执行操作、权限范围与停止条件已经明确</div>
          </div>
          <div class="item">
            <div class="item-title">约束与验证可执行</div>
            <div class="item-note">规则可被检查，结果可由独立条件验证</div>
          </div>
        </div>

        <div class="emphasis">搜索、规划与具体路径仍可动态形成</div>
      </article>

      <article class="panel agent">
        <div class="panel-title">难以提前穷举</div>
        <div class="panel-subtitle">Agent 在运行时完成开放判断</div>

        <div class="agent-items">
          <div class="item">
            <div class="item-title">语境理解</div>
            <div class="item-note">识别文字背后的真实意图</div>
          </div>
          <div class="item">
            <div class="item-title">关系发现</div>
            <div class="item-note">建立未被显式表达的关联</div>
          </div>
          <div class="item">
            <div class="item-title">约束权衡</div>
            <div class="item-note">在冲突条件之间进行取舍</div>
          </div>
          <div class="item">
            <div class="item-title">路径调整</div>
            <div class="item-note">根据新反馈改变下一步行动</div>
          </div>
        </div>

        <div class="emphasis">补足未被充分建模的判断</div>
      </article>
    </section>

    <div class="conclusion">
      <strong>Agent 扩展问题边界</strong>，传统编程继续承载已经明确的责任
    </div>
  </main>
</body>
</html>
